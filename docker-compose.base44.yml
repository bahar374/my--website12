services:
  web:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    environment:
      - NODE_ENV=development
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  node_modules:
