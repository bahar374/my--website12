# Base44 development environment.
#
# Runs the Vite dev server straight from the cloned source (bind-mounted), so
# every edit is reflected in the preview without rebuilding an image.
# No external services or credentials are required by this project.

services:
  web:
    image: node:22
    working_dir: /app
    # Install from the committed lockfile, then hand off to the live-reload dev server.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - CI=true
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure

volumes:
  node_modules:
